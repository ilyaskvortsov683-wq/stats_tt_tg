[project]
name = "stats-api"
version = "0.1.0"
description = "API, воркер и Telegram-бот сервиса аналитики экспортов Telegram и TikTok"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "structlog>=24.4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "cryptography>=43",
    "pymorphy3>=2.0",
    "itsdangerous>=2.2",
    "arq>=0.26",
    "aiogram>=3.13",
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.140", "google-auth>=2.34"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "B008"]
