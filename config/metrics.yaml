# Пороги метрик. Попадают в отчёт в раздел «Как считали».
pause_hours: 6            # пауза, после которой «начинается разговор» (кто пишет первым)
reply_max_hours: 12       # ответ позже этого — не считается ответом
monologue_gap_min: 30     # внутри монолога сообщения одного автора идут с перерывом не больше N минут
dialog_gap_min: 30        # диалог — непрерывная переписка обоих, перерывы не больше N минут
tt_session_gap_min: 10    # TikTok: перерыв между просмотрами больше N минут — новая сессия
top_moments: 200          # сколько монологов/диалогов хранить в отчёте для выбора периода
top_gaps: 50
