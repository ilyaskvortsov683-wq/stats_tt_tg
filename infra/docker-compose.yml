# Прод на одном VPS в РФ (docs/19-deployment.md). Запуск из корня репозитория:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# Все секреты — в .env на сервере (не в git).

x-app: &app
  build:
    context: ..
    dockerfile: infra/api.Dockerfile
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://stats:${POSTGRES_PASSWORD}@postgres:5432/stats
    REDIS_URL: redis://redis:6379/0
  depends_on: [postgres, redis]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "10" }
  volumes:
    - reports:/srv/apps/api/data/reports

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    restart: unless-stopped

  api:
    <<: *app

  worker:
    <<: *app
    command: ["arq", "app.workers.tasks.WorkerSettings"]

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Фаза 9: локальный сервер Bot API для файлов до 2 ГБ.
  # telegram-bot-api:
  #   image: aiogram/telegram-bot-api:latest
  #   environment: { TELEGRAM_API_ID: ${TG_API_ID}, TELEGRAM_API_HASH: ${TG_API_HASH} }
  #   volumes: [tg_bot_api:/var/lib/telegram-bot-api]

  # Фаза 12: ежедневный бэкап PostgreSQL → шифрование age → S3 в РФ.

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  reports:
